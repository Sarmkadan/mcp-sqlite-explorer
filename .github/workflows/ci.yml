name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore McpSqliteExplorer.slnx

      - name: Build
        run: dotnet build McpSqliteExplorer.slnx --no-restore -c Release

      - name: Test
        run: dotnet test McpSqliteExplorer.slnx --no-build -c Release
